<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hitscan Duell 1v1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; touch-action: none; }
    
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
    .hidden { display: none !important; }

    .panel { background: rgba(22, 25, 35, 0.95); border: 1px solid #2d3348; padding: 20px; border-radius: 8px; width: 90%; max-width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); max-height: 90vh; overflow-y: auto; }
    h1 { font-size: 20px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; color: #f5a623; }
    h2 { font-size: 13px; margin: 14px 0 6px 0; text-transform: uppercase; color: #8a93a8; border-bottom: 1px solid #2d3348; padding-bottom: 4px; }
    input[type="text"] { width: 100%; padding: 10px; background: #12141c; border: 1px solid #3b425b; border-radius: 4px; color: #fff; font-size: 15px; outline: none; margin-bottom: 10px; }
    input[type="text"]:focus { border-color: #f5a623; }
    button { width: 100%; padding: 10px; background: #f5a623; border: none; border-radius: 4px; color: #000; font-weight: 700; cursor: pointer; text-transform: uppercase; }
    button:hover { background: #e09418; }
    button.secondary { background: #2d3348; color: #fff; margin-top: 8px; }
    button.bot-btn { background: #2563eb; color: #fff; margin-top: 10px; }
    button.bot-btn:hover { background: #1d4ed8; }

    /* Charakterauswahl */
    .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
    .char-btn { background: #181b26; border: 2px solid #333b52; color: #cbd5e1; padding: 8px 4px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; text-transform: none; text-align: center; }
    .char-btn.active { border-color: #f5a623; background: #2e2617; color: #f5a623; }

    ul { list-style: none; max-height: 100px; overflow-y: auto; margin-bottom: 6px; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; background: #12141c; margin-bottom: 4px; border-radius: 4px; font-size: 12px; }
    li button { width: auto; padding: 4px 10px; font-size: 11px; }

    /* HUD */
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%); border: 2px solid #000; border-radius: 50%; background: rgba(255,255,255,0.8); }
    #stats-bar { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; font-size: 18px; font-weight: 800; background: rgba(18, 20, 29, 0.85); padding: 8px 18px; border-radius: 6px; border: 1px solid #444; white-space: nowrap; }
    .hud-timer { color: #f5a623; }
    .hud-score { color: #4ade80; }
    .hud-opp-score { color: #ef4444; }
    #hitmarker { position: absolute; top: 50%; left: 50%; width: 24px; height: 24px; transform: translate(-50%, -50%); border: 3px solid #22c55e; border-radius: 50%; opacity: 0; transition: opacity 0.08s; pointer-events: none; }

    /* Mobile Touch */
    #touch-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; }
    #joystick-base { position: absolute; left: 25px; bottom: 25px; width: 110px; height: 110px; background: rgba(0,0,0,0.25); border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; pointer-events: auto; }
    #joystick-knob { position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; background: #f5a623; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    #btn-touch-fire { position: absolute; right: 25px; bottom: 35px; width: 80px; height: 80px; border-radius: 50%; background: #ef4444; border: 3px solid #fff; color: #fff; font-size: 13px; font-weight: 900; pointer-events: auto; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    #btn-touch-fire:active { background: #b91c1c; transform: scale(0.95); }
  </style>
</head>
<body>

  <!-- Screen 1: Login -->
  <div id="screen-login" class="screen">
    <div class="panel">
      <h1>Hitscan Duell 1v1</h1>
      <input type="text" id="username-input" placeholder="Spielername eingeben..." maxlength="14">
      <button id="btn-login">Lobby Betreten</button>
    </div>
  </div>

  <!-- Screen 2: Lobby -->
  <div id="screen-lobby" class="screen hidden">
    <div class="panel">
      <h1>Lobby</h1>
      <div>Angemeldet als: <strong id="my-name-display" style="color: #f5a623;"></strong></div>

      <h2>Wähle deinen Charakter</h2>
      <div class="char-grid">
        <button class="char-btn active" data-char="marley">Bob Marley</button>
        <button class="char-btn" data-char="bread">Brot</button>
        <button class="char-btn" data-char="horse">Pferd</button>
        <button class="char-btn" data-char="dolphin">Delfin</button>
        <button class="char-btn" data-char="grill">3-Bein-Grill</button>
      </div>

      <button id="btn-start-bot" class="bot-btn">Gegen Bot spielen (Warmup)</button>

      <h2>Verfügbare Spieler</h2>
      <ul id="player-list"></ul>

      <h2>Bestenliste (1v1)</h2>
      <ul id="leaderboard-list"></ul>
    </div>
  </div>

  <!-- Screen 3: Herausforderung -->
  <div id="screen-challenge" class="screen hidden" style="background: rgba(0,0,0,0.75); z-index: 20;">
    <div class="panel" style="text-align: center;">
      <h1>Herausforderung!</h1>
      <p id="challenge-text" style="margin-bottom: 16px; font-size: 15px;"></p>
      <button id="btn-accept-challenge">Annehmen</button>
      <button id="btn-decline-challenge" class="secondary">Ablehnen</button>
    </div>
  </div>

  <!-- Screen 4: Game Over -->
  <div id="screen-gameover" class="screen hidden" style="background: rgba(0,0,0,0.85); z-index: 20;">
    <div class="panel" style="text-align: center;">
      <h1 id="gameover-title">Runde Beendet</h1>
      <p id="gameover-details" style="margin-bottom: 20px; font-size: 15px;"></p>
      <button id="btn-back-to-lobby">Zurück zur Lobby</button>
    </div>
  </div>

  <!-- In-Game HUD -->
  <div id="hud" class="hidden">
    <div id="stats-bar">
      <div>Du: <span id="hud-my-score" class="hud-score">0</span></div>
      <div class="hud-timer"><span id="hud-timer">60</span>s</div>
      <div>Gegner: <span id="hud-opp-score" class="hud-opp-score">0</span></div>
    </div>
    <div id="crosshair"></div>
    <div id="hitmarker"></div>
  </div>

  <!-- Touch Controls -->
  <div id="touch-layer" class="hidden">
    <div id="joystick-base"><div id="joystick-knob"></div></div>
    <div id="btn-touch-fire">FEUER</div>
  </div>

  <div id="game-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const socket = io();
    let myName = '';
    let myId = '';
    let pendingChallengerId = null;
    let selectedChar = 'marley';

    let inGame = false;
    let isBotMode = false;
    let botTimerInterval = null;
    let botTimeLeft = 60;
    let botScorePlayer = 0;
    let botScoreEnemy = 0;

    let opponentId = null;
    let opponentRoot = null;
    let opponentHitbox = null;
    let opponentVisuals = {};
    let currentOpponentChar = 'marley';

    let camera, scene, renderer;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    const clock = new THREE.Clock();

    const particles = [];
    let leafTexture = null;

    const screenLogin = document.getElementById('screen-login');
    const screenLobby = document.getElementById('screen-lobby');
    const screenChallenge = document.getElementById('screen-challenge');
    const screenGameOver = document.getElementById('screen-gameover');
    const hud = document.getElementById('hud');
    const touchLayer = document.getElementById('touch-layer');
    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');
    const btnTouchFire = document.getElementById('btn-touch-fire');

    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    // Charakterauswahl
    document.querySelectorAll('.char-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedChar = btn.getAttribute('data-char');
      });
    });

    // Login & Lobby
    document.getElementById('btn-login').addEventListener('click', () => {
      const input = document.getElementById('username-input').value.trim();
      if (!input) return;
      myName = input;
      localStorage.setItem('duel_username', myName);
      socket.emit('join-lobby', myName);
      document.getElementById('my-name-display').innerText = myName;
      screenLogin.classList.add('hidden');
      screenLobby.classList.remove('hidden');
    });

    const savedName = localStorage.getItem('duel_username');
    if (savedName) document.getElementById('username-input').value = savedName;

    socket.on('connect', () => { myId = socket.id; });

    socket.on('lobby-update', (list) => {
      const ul = document.getElementById('player-list');
      ul.innerHTML = '';
      list.forEach(p => {
        if (p.id === socket.id) return;
        const li = document.createElement('li');
        li.innerHTML = `<span>${p.name} (${p.status})</span>`;
        if (p.status === 'lobby') {
          const btn = document.createElement('button');
          btn.innerText = 'Duellieren';
          btn.onclick = () => socket.emit('send-challenge', p.id);
          li.appendChild(btn);
        }
        ul.appendChild(li);
      });
    });

    socket.on('leaderboard-update', (list) => {
      const ul = document.getElementById('leaderboard-list');
      ul.innerHTML = '';
      list.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${item.name}</span><span>${item.wins} Siege / ${item.kills} Kills</span>`;
        ul.appendChild(li);
      });
    });

    socket.on('challenge-received', (data) => {
      pendingChallengerId = data.challengerId;
      document.getElementById('challenge-text').innerText = `${data.challengerName} fordert dich zum Duell heraus!`;
      screenChallenge.classList.remove('hidden');
    });

    document.getElementById('btn-accept-challenge').onclick = () => {
      screenChallenge.classList.add('hidden');
      if (isBotMode) stopBotMatch();
      socket.emit('accept-challenge', pendingChallengerId);
    };

    document.getElementById('btn-decline-challenge').onclick = () => {
      screenChallenge.classList.add('hidden');
      socket.emit('decline-challenge', pendingChallengerId);
      pendingChallengerId = null;
    };

    socket.on('challenge-declined', (data) => {
      alert(`${data.name} hat die Herausforderung abgelehnt.`);
    });

    document.getElementById('btn-back-to-lobby').onclick = () => {
      screenGameOver.classList.add('hidden');
      screenLobby.classList.remove('hidden');
      if (document.pointerLockElement) document.exitPointerLock();
    };

    // Textur für Marihuanablätter prozedural zeichnen
    function createMarijuanaLeafTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, 128, 128);
      ctx.fillStyle = '#16a34a';

      ctx.save();
      ctx.translate(64, 112);

      // Fünf gezackte Blattfinger
      const leaves = [
        { rot: -0.65, length: 50, width: 7 },
        { rot: -0.32, length: 78, width: 8.5 },
        { rot: 0,     length: 98, width: 9.5 },
        { rot: 0.32,  length: 78, width: 8.5 },
        { rot: 0.65,  length: 50, width: 7 }
      ];

      leaves.forEach(l => {
        ctx.save();
        ctx.rotate(l.rot);
        ctx.beginPath();
        ctx.ellipse(0, -l.length / 2, l.width, l.length / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Blattstiel
      ctx.strokeStyle = '#15803d';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 14);
      ctx.stroke();

      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    // Three.js Hauptszene
    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 45, 90);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.getElementById('game-container').appendChild(renderer.domElement);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x94a3b8, 0.75);
      hemiLight.position.set(0, 50, 0);
      scene.add(hemiLight);

      const sunLight = new THREE.DirectionalLight(0xfff7ed, 0.95);
      sunLight.position.set(20, 40, 20);
      sunLight.castShadow = true;
      scene.add(sunLight);

      // Arena Boden
      const floorGeo = new THREE.PlaneGeometry(36, 36);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0xd6cbb8, roughness: 0.7 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const grid = new THREE.GridHelper(36, 36, 0x8b5cf6, 0xa8a29e);
      grid.position.y = 0.01;
      scene.add(grid);

      // Wände
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.5 });
      const makeWall = (w, h, d, x, y, z, color) => {
        const group = new THREE.Group();
        group.add(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat));
        const strip = new THREE.Mesh(new THREE.BoxGeometry(w > d ? w : 1.05, 0.6, d > w ? d : 1.05), new THREE.MeshBasicMaterial({ color }));
        strip.position.y = 1.0;
        group.add(strip);
        group.position.set(x, y, z);
        scene.add(group);
      };

      makeWall(36, 4.5, 1, 0, 2.25, -18, 0x2563eb);
      makeWall(36, 4.5, 1, 0, 2.25, 18, 0xea580c);
      makeWall(1, 4.5, 36, -18, 2.25, 0, 0x16a34a);
      makeWall(1, 4.5, 36, 18, 2.25, 0, 0x9333ea);

      spawnMapProps();
      setupCigaretteWeapon();
      setupOpponentActor();

      leafTexture = createMarijuanaLeafTexture();

      window.addEventListener('resize', onWindowResize);
      setupControls();
      setupTouchControls();
    }

    function spawnMapProps() {
      // Bierflasche
      const bottleGroup = new THREE.Group();
      const bottleMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.2 });
      const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 3.2, 16), bottleMat);
      b1.position.y = 1.6;
      bottleGroup.add(b1);
      const b2 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.7, 1.2, 16), bottleMat);
      b2.position.y = 3.6;
      bottleGroup.add(b2);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8 }));
      cap.position.y = 4.3;
      bottleGroup.add(cap);
      bottleGroup.position.set(-6, 0, -4);
      scene.add(bottleGroup);

      // Martini Glas
      const martiniGroup = new THREE.Group();
      const stemMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.6 });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.1, 16), stemMat);
      base.position.y = 0.05;
      martiniGroup.add(base);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.5, 12), stemMat);
      stem.position.y = 1.3;
      martiniGroup.add(stem);
      const cone = new THREE.Mesh(new THREE.ConeGeometry(1.8, 1.6, 16, 1, true), new THREE.MeshStandardMaterial({ color: 0x271306, transparent: true, opacity: 0.9 }));
      cone.position.y = 3.1;
      cone.rotation.x = Math.PI;
      martiniGroup.add(cone);
      martiniGroup.position.set(6, 0, 4);
      scene.add(martiniGroup);

      // Pommes-Tüte
      const friesGroup = new THREE.Group();
      const bag = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.4, 1.4), new THREE.MeshStandardMaterial({ color: 0xdc2626 }));
      bag.position.y = 1.2;
      friesGroup.add(bag);
      const fryMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
      for (let i = 0; i < 7; i++) {
        const fry = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.8, 0.22), fryMat);
        fry.position.set((Math.random() - 0.5) * 1.4, 2.2, (Math.random() - 0.5) * 0.8);
        friesGroup.add(fry);
      }
      friesGroup.position.set(0, 0, 0);
      scene.add(friesGroup);
    }

    // Waffe: Rauchende Zigarette
    let cigWeapon;
    let smokePuffs = [];
    function setupCigaretteWeapon() {
      cigWeapon = new THREE.Group();

      // Weißes Papier
      const paperMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.6 });
      const paper = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.45, 12), paperMat);
      paper.rotation.x = Math.PI / 2;
      cigWeapon.add(paper);

      // Filter
      const filterMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.8 });
      const filter = new THREE.Mesh(new THREE.CylinderGeometry(0.0245, 0.0245, 0.16, 12), filterMat);
      filter.rotation.x = Math.PI / 2;
      filter.position.z = 0.26;
      cigWeapon.add(filter);

      // Asche und brennende Glut
      const ashMat = new THREE.MeshStandardMaterial({ color: 0x52525b, roughness: 0.9 });
      const ash = new THREE.Mesh(new THREE.CylinderGeometry(0.023, 0.024, 0.04, 12), ashMat);
      ash.rotation.x = Math.PI / 2;
      ash.position.z = -0.24;
      cigWeapon.add(ash);

      const glowMat = new THREE.MeshBasicMaterial({ color: 0xff3b00 });
      const glowTip = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 8), glowMat);
      glowTip.position.z = -0.26;
      cigWeapon.add(glowTip);

      cigWeapon.position.set(0.28, -0.2, -0.42);
      camera.add(cigWeapon);
      scene.add(camera);

      // Initialer Rauchpartikel-Pool für die Waffe
      for (let i = 0; i < 8; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.018, 6, 6),
          new THREE.MeshBasicMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.5 })
        );
        p.visible = false;
        scene.add(p);
        smokePuffs.push({ mesh: p, life: 0 });
      }
    }

    function updateCigaretteSmoke(delta) {
      if (!cigWeapon) return;

      const tipWorldPos = new THREE.Vector3();
      cigWeapon.localToWorld(tipWorldPos.set(0, 0, -0.26));

      smokePuffs.forEach(sp => {
        if (!sp.mesh.visible && Math.random() < 0.25) {
          sp.mesh.position.copy(tipWorldPos);
          sp.mesh.visible = true;
          sp.life = 1.0;
          sp.mesh.scale.set(1, 1, 1);
        } else if (sp.mesh.visible) {
          sp.life -= delta * 1.8;
          sp.mesh.position.y += delta * 0.35;
          sp.mesh.position.x += (Math.random() - 0.5) * delta * 0.1;
          const scale = 1.0 + (1.0 - sp.life) * 2.5;
          sp.mesh.scale.set(scale, scale, scale);
          sp.mesh.material.opacity = sp.life * 0.45;

          if (sp.life <= 0) {
            sp.mesh.visible = false;
          }
        }
      });
    }

    // Aufbau der 5 Charaktermodelle
    function setupOpponentActor() {
      opponentRoot = new THREE.Group();

      // Unsichtbare Hitbox: Identischer Zylinder für 100% faire Wettbewerbsbedingungen
      const hitGeo = new THREE.CylinderGeometry(0.48, 0.48, 1.8, 12);
      const hitMat = new THREE.MeshBasicMaterial({ visible: false, wireframe: true });
      opponentHitbox = new THREE.Mesh(hitGeo, hitMat);
      opponentHitbox.position.y = 0.9;
      opponentRoot.add(opponentHitbox);

      // Visuelle Modelle
      opponentVisuals['marley'] = buildMarleyModel();
      opponentVisuals['bread'] = buildBreadModel();
      opponentVisuals['horse'] = buildHorseModel();
      opponentVisuals['dolphin'] = buildDolphinModel();
      opponentVisuals['grill'] = buildGrillModel();

      Object.values(opponentVisuals).forEach(m => opponentRoot.add(m));
      switchOpponentVisual('marley');

      opponentRoot.position.set(0, -100, 0);
      scene.add(opponentRoot);
    }

    function switchOpponentVisual(charKey) {
      currentOpponentChar = charKey;
      Object.keys(opponentVisuals).forEach(k => {
        opponentVisuals[k].visible = (k === charKey);
      });
    }

    // 1. Bob Marley Modell
    function buildMarleyModel() {
      const g = new THREE.Group();
      const coatMat = new THREE.MeshStandardMaterial({ color: 0x14532d });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.42, 1.1, 12), coatMat);
      body.position.y = 0.65;
      g.add(body);

      const skinMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), skinMat);
      head.position.y = 1.45;
      g.add(head);

      // Rasta Mütze (Rot, Gelb, Grün)
      const redBand = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.1, 14), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
      redBand.position.y = 1.62;
      g.add(redBand);
      const yellowBand = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.36, 0.12, 14), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
      yellowBand.position.y = 1.72;
      g.add(yellowBand);
      const greenTop = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 8), new THREE.MeshStandardMaterial({ color: 0x16a34a }));
      greenTop.position.y = 1.82;
      g.add(greenTop);

      // Dreadlocks
      const dreadMat = new THREE.MeshStandardMaterial({ color: 0x171717, roughness: 0.9 });
      for (let i = 0; i < 9; i++) {
        const dread = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.03, 0.7, 6), dreadMat);
        const ang = (i / 9) * Math.PI * 1.3 - Math.PI * 0.65;
        dread.position.set(Math.sin(ang) * 0.34, 1.32, Math.cos(ang) * 0.28 - 0.1);
        dread.rotation.z = Math.sin(ang) * 0.2;
        g.add(dread);
      }
      return g;
    }

    // 2. Brot Modell
    function buildBreadModel() {
      const g = new THREE.Group();
      const crustMat = new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.6 });
      const insideMat = new THREE.MeshStandardMaterial({ color: 0xfde68a, roughness: 0.8 });

      const block = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.1, 0.6), crustMat);
      block.position.y = 0.75;
      g.add(block);

      const topLoaf = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.75, 12), crustMat);
      topLoaf.rotation.z = Math.PI / 2;
      topLoaf.position.y = 1.3;
      g.add(topLoaf);

      // Scheibenfläche vorn
      const face = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.95), insideMat);
      face.position.set(0, 0.75, 0.305);
      g.add(face);

      // Augen
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), eyeMat);
      e1.position.set(-0.16, 0.85, 0.31);
      const e2 = e1.clone();
      e2.position.x = 0.16;
      g.add(e1);
      g.add(e2);
      return g;
    }

    // 3. Pferd Modell
    function buildHorseModel() {
      const g = new THREE.Group();
      const furMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.7 });
      const maneMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.9 });

      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.42, 1.2, 12), furMat);
      body.position.y = 0.7;
      g.add(body);

      // Pferdekopf mit langer Schnauze
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.45, 0.5), furMat);
      head.position.set(0, 1.45, 0.2);
      head.rotation.x = 0.35;
      g.add(head);

      const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.4), new THREE.MeshStandardMaterial({ color: 0x3f2e18 }));
      muzzle.position.set(0, 1.35, 0.46);
      g.add(muzzle);

      // Ohren
      const earGeo = new THREE.ConeGeometry(0.08, 0.22, 6);
      const ear1 = new THREE.Mesh(earGeo, furMat);
      ear1.position.set(-0.14, 1.76, 0.1);
      const ear2 = ear1.clone();
      ear2.position.x = 0.14;
      g.add(ear1);
      g.add(ear2);

      // Mähne
      const mane = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.65, 0.22), maneMat);
      mane.position.set(0, 1.4, -0.05);
      g.add(mane);
      return g;
    }

    // 4. Delfin Modell
    function buildDolphinModel() {
      const g = new THREE.Group();
      const dorsalMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2 });
      const bellyMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 });

      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.34, 1.25, 14), dorsalMat);
      body.position.y = 0.75;
      g.add(body);

      const belly = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.28, 1.15, 14), bellyMat);
      belly.position.set(0, 0.75, 0.1);
      belly.scale.set(0.9, 1, 0.5);
      g.add(belly);

      // Kopf & Rostrum
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.36, 14, 14), dorsalMat);
      head.position.y = 1.4;
      g.add(head);

      const rostrum = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.4, 10), dorsalMat);
      rostrum.rotation.x = Math.PI / 2;
      rostrum.position.set(0, 1.35, 0.42);
      g.add(rostrum);

      // Rückenflosse
      const dorsalFin = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.38, 0.4), dorsalMat);
      dorsalFin.position.set(0, 1.0, -0.38);
      dorsalFin.rotation.x = -0.4;
      g.add(dorsalFin);

      // Brustflossen
      const finMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
      const f1 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.08, 0.2), finMat);
      f1.position.set(0.38, 0.8, 0.1);
      f1.rotation.z = -0.4;
      const f2 = f1.clone();
      f2.position.x = -0.38;
      f2.rotation.z = 0.4;
      g.add(f1);
      g.add(f2);
      return g;
    }

    // 5. 3-Bein-Grill Modell
    function buildGrillModel() {
      const g = new THREE.Group();
      const metalMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.85, roughness: 0.2 });
      const bowlMat = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.4 });

      // Grillkugel unten
      const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.48, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), bowlMat);
      bowl.rotation.x = Math.PI;
      bowl.position.y = 1.05;
      g.add(bowl);

      // Kugeldeckel
      const lid = new THREE.Mesh(new THREE.SphereGeometry(0.46, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), bowlMat);
      lid.position.y = 1.15;
      g.add(lid);

      // Deckelgriff
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.25, 8), metalMat);
      handle.rotation.z = Math.PI / 2;
      handle.position.y = 1.65;
      g.add(handle);

      // 3 Beine
      for (let i = 0; i < 3; i++) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.15, 8), metalMat);
        const ang = (i / 3) * Math.PI * 2;
        leg.position.set(Math.sin(ang) * 0.26, 0.52, Math.cos(ang) * 0.26);
        leg.rotation.x = Math.cos(ang) * 0.25;
        leg.rotation.z = -Math.sin(ang) * 0.25;
        g.add(leg);
      }
      return g;
    }

    // Treffer-Animation: Marihuanablätter-Explosion
    function spawnLeafExplosion(point) {
      const leafCount = 28;
      const mat = new THREE.SpriteMaterial({ map: leafTexture, transparent: true, opacity: 1 });

      for (let i = 0; i < leafCount; i++) {
        const sprite = new THREE.Sprite(mat.clone());
        sprite.scale.set(0.45, 0.45, 0.45);
        sprite.position.copy(point);

        const velocity = new THREE.Vector3(
          (Math.random() - 0.5) * 8.5,
          Math.random() * 5.5 + 2.5,
          (Math.random() - 0.5) * 8.5
        );

        scene.add(sprite);
        particles.push({
          sprite,
          vel: velocity,
          rotVel: (Math.random() - 0.5) * 8,
          life: 1.0,
          maxLife: 1.2 + Math.random() * 0.6
        });
      }
    }

    function updateParticles(delta) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= delta / p.maxLife;

        // Gravitation und Bewegung
        p.vel.y -= 9.81 * delta;
        p.sprite.position.addScaledVector(p.vel, delta);
        p.sprite.material.rotation += p.rotVel * delta;
        p.sprite.material.opacity = Math.max(0, p.life);

        if (p.life <= 0) {
          scene.remove(p.sprite);
          particles.splice(i, 1);
        }
      }
    }

    // Desktop Steuerung
    function setupControls() {
      window.addEventListener('keydown', (e) => {
        if (!inGame) return;
        if (e.code === 'KeyW') moveForward = true;
        if (e.code === 'KeyS') moveBackward = true;
        if (e.code === 'KeyA') moveLeft = true;
        if (e.code === 'KeyD') moveRight = true;
      });

      window.addEventListener('keyup', (e) => {
        if (!inGame) return;
        if (e.code === 'KeyW') moveForward = false;
        if (e.code === 'KeyS') moveBackward = false;
        if (e.code === 'KeyA') moveLeft = false;
        if (e.code === 'KeyD') moveRight = false;
      });

      document.body.addEventListener('click', () => {
        if (isTouchDevice) return;
        if (inGame && document.pointerLockElement !== document.body) {
          document.body.requestPointerLock();
        } else if (inGame && document.pointerLockElement === document.body) {
          fireHitscan();
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === document.body && inGame) {
          camera.rotation.y -= e.movementX * 0.0022;
          const pitchDelta = e.movementY * 0.0022;
          camera.rotation.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, camera.rotation.x - pitchDelta));
        }
      });
    }

    // Touch Steuerung
    let touchMoveVector = { x: 0, z: 0 };
    let joyTouchId = null;
    let lookTouchId = null;
    let lastTouchLookX = 0, lastTouchLookY = 0;

    function setupTouchControls() {
      joystickBase.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        joyTouchId = touch.identifier;
        handleJoystickMove(touch);
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.touches.length; i++) {
          const t = e.touches[i];
          if (t.identifier === joyTouchId) {
            handleJoystickMove(t);
          } else if (t.identifier === lookTouchId) {
            const dx = t.clientX - lastTouchLookX;
            const dy = t.clientY - lastTouchLookY;
            camera.rotation.y -= dx * 0.004;
            camera.rotation.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, camera.rotation.x - dy * 0.004));
            lastTouchLookX = t.clientX;
            lastTouchLookY = t.clientY;
          }
        }
      }, { passive: false });

      const handleTouchEnd = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === joyTouchId) {
            joyTouchId = null;
            touchMoveVector = { x: 0, z: 0 };
            joystickKnob.style.transform = 'translate(-50%, -50%)';
          }
          if (t.identifier === lookTouchId) {
            lookTouchId = null;
          }
        }
      };
      window.addEventListener('touchend', handleTouchEnd);
      window.addEventListener('touchcancel', handleTouchEnd);

      window.addEventListener('touchstart', (e) => {
        if (!inGame) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.clientX > window.innerWidth * 0.35 && lookTouchId === null) {
            const btnRect = btnTouchFire.getBoundingClientRect();
            if (t.clientX >= btnRect.left && t.clientX <= btnRect.right &&
                t.clientY >= btnRect.top && t.clientY <= btnRect.bottom) {
              continue;
            }
            lookTouchId = t.identifier;
            lastTouchLookX = t.clientX;
            lastTouchLookY = t.clientY;
          }
        }
      });

      btnTouchFire.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (inGame) fireHitscan();
      }, { passive: false });
    }

    function handleJoystickMove(touch) {
      const rect = joystickBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let dx = touch.clientX - centerX;
      let dy = touch.clientY - centerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const maxRadius = rect.width / 2;

      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
      }
      joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      touchMoveVector.x = dx / maxRadius;
      touchMoveVector.z = dy / maxRadius;
    }

    // Schusslogik (Hitscan gegen Hitbox)
    const raycaster = new THREE.Raycaster();
    function fireHitscan() {
      // Rückstoß der Zigarette
      cigWeapon.position.z += 0.05;
      setTimeout(() => { cigWeapon.position.z -= 0.05; }, 50);

      raycaster.setFromCamera({ x: 0, y: 0 }, camera);
      const hits = raycaster.intersectObject(opponentHitbox, false);

      const startPos = new THREE.Vector3();
      cigWeapon.getWorldPosition(startPos);
      const endPos = new THREE.Vector3();

      if (hits.length > 0) {
        endPos.copy(hits[0].point);

        const marker = document.getElementById('hitmarker');
        marker.style.opacity = '1';
        setTimeout(() => { marker.style.opacity = '0'; }, 90);

        // Blätter-Animation starten
        spawnLeafExplosion(hits[0].point);

        if (isBotMode) {
          botScorePlayer++;
          document.getElementById('hud-my-score').innerText = botScorePlayer;
          respawnBot();
        } else {
          socket.emit('hit-target', opponentId);
        }
      } else {
        raycaster.ray.at(50, endPos);
      }

      renderTracer(startPos, endPos, 0xff4400);
      if (!isBotMode) {
        socket.emit('shot-fired', { start: startPos, end: endPos, hitPoint: hits.length > 0 ? hits[0].point : null });
      }
    }

    function renderTracer(start, end, colorHex) {
      const material = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 3 });
      const geometry = new THREE.BufferGeometry().setFromPoints([start, end]);
      const line = new THREE.Line(geometry, material);
      scene.add(line);
      setTimeout(() => { scene.remove(line); }, 50);
    }

    // Bot Logik
    const botState = { targetPos: new THREE.Vector3(0, 0, 0), shootCooldown: 2.2 };
    const botChars = ['marley', 'bread', 'horse', 'dolphin', 'grill'];

    document.getElementById('btn-start-bot').addEventListener('click', () => {
      startBotMatch();
    });

    function startBotMatch() {
      isBotMode = true;
      inGame = true;
      botScorePlayer = 0;
      botScoreEnemy = 0;
      botTimeLeft = 60;

      // Zufälliger Bot-Charakter
      const randomChar = botChars[Math.floor(Math.random() * botChars.length)];
      switchOpponentVisual(randomChar);

      screenLobby.classList.add('hidden');
      screenGameOver.classList.add('hidden');
      hud.classList.remove('hidden');
      if (isTouchDevice) touchLayer.classList.remove('hidden');

      camera.position.set(0, 1.6, 14);
      camera.rotation.set(0, Math.PI, 0);

      document.getElementById('hud-my-score').innerText = '0';
      document.getElementById('hud-opp-score').innerText = '0';
      document.getElementById('hud-timer').innerText = '60';

      respawnBot();
      if (!isTouchDevice) document.body.requestPointerLock();

      botTimerInterval = setInterval(() => {
        botTimeLeft--;
        document.getElementById('hud-timer').innerText = botTimeLeft;
        if (botTimeLeft <= 0) endBotMatch();
      }, 1000);
    }

    function respawnBot() {
      opponentRoot.position.set((Math.random() - 0.5) * 24, 0, (Math.random() - 0.5) * 12 - 4);
      pickNewBotTarget();
    }

    function pickNewBotTarget() {
      botState.targetPos.set((Math.random() - 0.5) * 26, 0, (Math.random() - 0.5) * 26);
    }

    function updateBotAI(delta) {
      const dir = new THREE.Vector3().subVectors(botState.targetPos, opponentRoot.position);
      dir.y = 0;
      const dist = dir.length();

      if (dist < 1.0) {
        pickNewBotTarget();
      } else {
        dir.normalize();
        opponentRoot.position.addScaledVector(dir, 5.5 * delta);
        opponentRoot.lookAt(camera.position.x, 0, camera.position.z);
      }

      botState.shootCooldown -= delta;
      if (botState.shootCooldown <= 0) {
        botState.shootCooldown = 2.0 + Math.random() * 1.5;
        const botGunPos = opponentRoot.position.clone().add(new THREE.Vector3(0, 1.2, 0));
        const target = camera.position.clone().add(new THREE.Vector3(
          (Math.random() - 0.5) * 1.8,
          (Math.random() - 0.5) * 1.2,
          (Math.random() - 0.5) * 1.8
        ));
        renderTracer(botGunPos, target, 0xff4400);

        if (target.distanceTo(camera.position) < 1.0) {
          botScoreEnemy++;
          document.getElementById('hud-opp-score').innerText = botScoreEnemy;
          spawnLeafExplosion(camera.position);
          camera.position.set((Math.random() - 0.5) * 16, 1.6, 14);
        }
      }
    }

    function stopBotMatch() {
      clearInterval(botTimerInterval);
      isBotMode = false;
      inGame = false;
      opponentRoot.position.set(0, -100, 0);
      touchLayer.classList.add('hidden');
      hud.classList.add('hidden');
    }

    function endBotMatch() {
      stopBotMatch();
      screenGameOver.classList.remove('hidden');
      document.getElementById('gameover-title').innerText = botScorePlayer >= botScoreEnemy ? 'TRAINING GEWONNEN' : 'TRAINING BEENDET';
      document.getElementById('gameover-details').innerText = `Ergebnis gegen Bot: ${botScorePlayer} zu ${botScoreEnemy}`;
    }

    // Multiplayer Socket Events
    socket.on('opponent-shot', (tracer) => {
      renderTracer(
        new THREE.Vector3(tracer.start.x, tracer.start.y, tracer.start.z),
        new THREE.Vector3(tracer.end.x, tracer.end.y, tracer.end.z),
        0xff4400
      );
      if (tracer.hitPoint) {
        spawnLeafExplosion(new THREE.Vector3(tracer.hitPoint.x, tracer.hitPoint.y, tracer.hitPoint.z));
      }
    });

    socket.on('match-start', (data) => {
      if (isBotMode) stopBotMatch();

      screenLobby.classList.add('hidden');
      screenGameOver.classList.add('hidden');
      hud.classList.remove('hidden');
      if (isTouchDevice) touchLayer.classList.remove('hidden');

      inGame = true;
      isBotMode = false;
      opponentId = data.opponentId;

      camera.position.set(data.spawn.x, data.spawn.y, data.spawn.z);
      camera.rotation.set(0, data.spawn.rotY, 0);

      document.getElementById('hud-my-score').innerText = '0';
      document.getElementById('hud-opp-score').innerText = '0';
      document.getElementById('hud-timer').innerText = '60';

      if (!isTouchDevice) document.body.requestPointerLock();
    });

    socket.on('timer-tick', (timeLeft) => {
      if (!isBotMode) document.getElementById('hud-timer').innerText = timeLeft;
    });

    socket.on('score-update', (data) => {
      if (!isBotMode) {
        document.getElementById('hud-my-score').innerText = data.myScore;
        document.getElementById('hud-opp-score').innerText = data.oppScore;
      }
    });

    socket.on('respawn', (pos) => {
      spawnLeafExplosion(camera.position);
      camera.position.set(pos.x, pos.y, pos.z);
      camera.rotation.set(0, pos.rotY, 0);
    });

    socket.on('opponent-moved', (data) => {
      if (!isBotMode && opponentRoot) {
        opponentRoot.position.set(data.x, data.y - 0.9, data.z);
        opponentRoot.rotation.y = data.rotY;
        if (data.char && data.char !== currentOpponentChar) {
          switchOpponentVisual(data.char);
        }
      }
    });

    socket.on('game-over', (res) => {
      inGame = false;
      hud.classList.add('hidden');
      touchLayer.classList.add('hidden');
      if (document.pointerLockElement) document.exitPointerLock();

      screenGameOver.classList.remove('hidden');
      document.getElementById('gameover-title').innerText = res.winner === myName ? 'SIEG!' : (res.winner === 'Unentschieden' ? 'UNENTSCHIEDEN' : 'NIEDERLAGE');
      document.getElementById('gameover-details').innerText = `Endstand: ${res.p1Name} (${res.p1Score}) vs ${res.p2Name} (${res.p2Score})`;
      
      opponentRoot.position.set(0, -100, 0);
    });

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init3D();

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      updateCigaretteSmoke(delta);
      updateParticles(delta);

      if (inGame) {
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        if (isTouchDevice && (touchMoveVector.x !== 0 || touchMoveVector.z !== 0)) {
          direction.z = -touchMoveVector.z;
          direction.x = touchMoveVector.x;
        } else {
          direction.z = Number(moveForward) - Number(moveBackward);
          direction.x = Number(moveRight) - Number(moveLeft);
        }
        direction.normalize();

        const speed = 40.0;
        if (direction.z !== 0) velocity.z -= direction.z * speed * delta;
        if (direction.x !== 0) velocity.x -= direction.x * speed * delta;

        camera.translateX(-velocity.x * delta);
        camera.translateZ(velocity.z * delta);
        camera.position.y = 1.6;

        camera.position.x = Math.max(-16.5, Math.min(16.5, camera.position.x));
        camera.position.z = Math.max(-16.5, Math.min(16.5, camera.position.z));

        if (isBotMode) {
          updateBotAI(delta);
        } else {
          socket.emit('player-update', {
            x: camera.position.x,
            y: camera.position.y,
            z: camera.position.z,
            rotY: camera.rotation.y,
            char: selectedChar
          });
        }
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
